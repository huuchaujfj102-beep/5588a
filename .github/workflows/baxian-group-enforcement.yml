name: Baxian group integrity gate V3
on:
  push:
    paths:
      - 'film_audit/baxian_group_gate.py'
      - 'film_audit/assets/baxian_group_enforcement_policy_v3.json'
      - 'film_audit/assets/baxian_source_authority_v2_20261107.json'
      - 'film_audit/shots/s04_01_layered_group_plan_TEMPLATE.json'
      - 'tests/test_baxian_group_gate.py'
      - '.github/workflows/baxian-group-enforcement.yml'
      - 'docs/baxian-group-asset-enforcement-v3.md'
  pull_request:
    paths:
      - 'film_audit/baxian_group_gate.py'
      - 'film_audit/assets/baxian_group_enforcement_policy_v3.json'
      - 'film_audit/assets/baxian_source_authority_v2_20261107.json'
      - 'film_audit/shots/s04_01_layered_group_plan_TEMPLATE.json'
      - 'tests/test_baxian_group_gate.py'
      - '.github/workflows/baxian-group-enforcement.yml'
  workflow_dispatch:
    inputs:
      phase:
        description: 'preflight or postflight; all original PNGs/layers must already exist in checkout'
        type: choice
        required: true
        options:
          - preflight
          - postflight
      asset_root:
        description: 'Path under checkout containing approved PNG assets and masked RGBA layers'
        type: string
        required: true
        default: 'private_baxian_assets'
      plan_path:
        description: 'Shot manifest path (must contain real hashes and paths)'
        type: string
        required: true
        default: 'film_audit/shots/s04_01_layered_group_plan_TEMPLATE.json'
permissions:
  contents: read

jobs:
  gate-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test fail-closed integrity gate with synthetic image fixtures
        run: python -m unittest discover -s tests -p 'test_baxian_group_gate.py' -v

  asset-preflight:
    if: github.event_name == 'workflow_dispatch'
    needs: gate-unit-tests
    runs-on: ubuntu-latest
    env:
      ASSET_ROOT: ${{ inputs.asset_root }}
      PLAN_PATH: ${{ inputs.plan_path }}
      PHASE: ${{ inputs.phase }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify on-runner original PNGs, layers, hashes and QA evidence
        run: |
          python -m film_audit.baxian_group_gate \
            --phase "$PHASE" \
            --plan "$PLAN_PATH" \
            --asset-root "$ASSET_ROOT" \
            --report baxian-group-gate-report.json
      - name: Archive gate report even on blocked generation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baxian-group-gate-report
          path: baxian-group-gate-report.json
          if-no-files-found: warn
