name: OneFlow REAL image generation (FLUX.1 via Hugging Face)
on:
  push:
    paths:
      - 'oneflow/image_generation.py'
      - 'tests/test_oneflow_image_generation.py'
      - '.github/workflows/oneflow-generate-image.yml'
  pull_request:
    paths:
      - 'oneflow/image_generation.py'
      - 'tests/test_oneflow_image_generation.py'
      - '.github/workflows/oneflow-generate-image.yml'
  workflow_dispatch:
    inputs:
      one_sentence:
        description: 'Optional one-sentence image brief. Leave empty for original Snow White S01.'
        type: string
        required: false
        default: ''
      authorization_mode:
        description: 'Browser = confirm on Hugging Face (no GitHub secret); Secret = existing HF_TOKEN'
        type: choice
        required: true
        default: browser
        options:
          - browser
          - secret
      approve_paid_image:
        description: 'I authorize exactly one hosted image inference (can consume Hugging Face credits)'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: oneflow-real-image-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  free-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image client and image file validators
        run: python -m pip install 'huggingface_hub>=0.34,<2' 'Pillow>=11,<13'
      - name: Python tests (mocked provider, no charge)
        run: python -m unittest discover -s tests -p 'test_oneflow_image_generation.py' -v
      - name: Real Snow White S01 keyframe prompt dry-run (no image/no cost)
        run: |
          python -m oneflow.image_generation \
            --request-file oneflow/requests/snow-white-seven-dwarfs-60s.json \
            --shot S01 --dry-run
      - name: Confirm no image was invented
        run: |
          test ! -d private-inputs/generated-images
          echo "Offline tests succeeded. Real model has not been called."

  real-hf-image:
    needs: free-preflight
    if: github.event_name == 'workflow_dispatch' && inputs.approve_paid_image == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      ONE_SENTENCE: ${{ inputs.one_sentence }}
      AUTH_MODE: ${{ inputs.authorization_mode }}
      HF_HOME: ${{ runner.temp }}/oneflow-hf-browser-auth
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install supported image inference adapter and browser-login CLI
        run: python -m pip install 'huggingface_hub>=1,<2' 'Pillow>=11,<13'
      - name: Verify authorization choice (do not call any paid model)
        shell: bash
        run: |
          set -euo pipefail
          if [ "$AUTH_MODE" = "secret" ]; then
            if [ -z "$HF_TOKEN" ]; then
              echo "MISSING_HF_TOKEN: configure GitHub Actions secret HF_TOKEN." >&2
              exit 2
            fi
          elif [ "$AUTH_MODE" != "browser" ]; then
            echo "Invalid authorization mode" >&2
            exit 2
          fi
      - name: Browser authorization: open the official URL and approve the code
        if: inputs.authorization_mode == 'browser'
        env:
          HF_TOKEN: ''
        shell: bash
        run: |
          set -euo pipefail
          echo "OPEN THIS STEP'S LIVE LOGS. Visit the official Hugging Face approval URL shown below, confirm its one-time code, and approve inference access."
          echo "No Hugging Face token needs to be pasted into GitHub or chat."
          hf auth login --format agent
          python -c 'from huggingface_hub import get_token; assert get_token(), "Browser authorization did not create an access token"'
          echo "Browser authorization succeeded; token stored only on this temporary runner."

      - name: Invoke FLUX exactly once and verify a real PNG
        shell: bash
        run: |
          set -euo pipefail
          if [ "$AUTH_MODE" = "browser" ]; then
            unset HF_TOKEN
          fi
          if [ -z "$ONE_SENTENCE" ]; then
            python -m oneflow.image_generation \
              --request-file oneflow/requests/snow-white-seven-dwarfs-60s.json \
              --shot S01 --output private-inputs/generated-images \
              --approve-one-image
          else
            python -m oneflow.image_generation \
              --brief "$ONE_SENTENCE" \
              --shot S01 --output private-inputs/generated-images \
              --approve-one-image
          fi
          test -s private-inputs/generated-images/S01.png
          test -s private-inputs/generated-images/S01.json
      - name: Deliver real image and audit metadata (never fake an image)
        uses: actions/upload-artifact@v4
        with:
          name: oneflow-real-FLUX-S01-${{ github.run_id }}
          path: private-inputs/generated-images/
          if-no-files-found: error
          retention-days: 7
      - name: Destroy temporary browser OAuth files on this runner
        if: always()
        shell: bash
        run: |
          if [ -n "$HF_HOME" ] && [ "$HF_HOME" = "$RUNNER_TEMP/oneflow-hf-browser-auth" ]; then
            rm -rf -- "$HF_HOME"
          fi
          echo "Temporary Hugging Face browser credentials cleared from ephemeral job workspace."

