name: OneFlow REAL image generation (OVH free / Cloudflare FLUX / fal / HF)
on:
  push:
    paths:
      - 'oneflow/image_generation.py'
      - 'oneflow/fal_image.py'
      - 'oneflow/ovh_free_image.py'
      - 'oneflow/cloudflare_free_image.py'
      - 'tests/test_oneflow_image_generation.py'
      - 'tests/test_oneflow_fal_image.py'
      - 'tests/test_oneflow_ovh_free.py'
      - 'tests/test_oneflow_cloudflare_free_image.py'
      - '.github/workflows/oneflow-generate-image.yml'
  pull_request:
    paths:
      - 'oneflow/image_generation.py'
      - 'oneflow/fal_image.py'
      - 'oneflow/ovh_free_image.py'
      - 'oneflow/cloudflare_free_image.py'
      - 'tests/test_oneflow_image_generation.py'
      - 'tests/test_oneflow_fal_image.py'
      - 'tests/test_oneflow_ovh_free.py'
      - 'tests/test_oneflow_cloudflare_free_image.py'
      - '.github/workflows/oneflow-generate-image.yml'
  workflow_dispatch:
    inputs:
      image_provider:
        description: 'Image provider: OVH free or Cloudflare free FLUX; fal/HF need credits'
        type: choice
        required: true
        default: ovh_free
        options:
          - ovh_free
          - cloudflare_free
          - fal
          - huggingface
      approve_free_image:
        description: 'I approve ONE free test (OVH/Cloudflare); paid providers need separate approval'
        type: boolean
        required: true
        default: false
      confirm_cloudflare_workers_free:
        description: 'For Cloudflare only: I confirmed the account uses Workers Free (not Paid)'
        type: boolean
        required: true
        default: false
      one_sentence:
        description: 'Optional image brief. Leave empty for Snow White mirror scene S01.'
        type: string
        required: false
        default: ''
      approve_paid_image:
        description: 'I authorize ONE potentially paid image inference with the selected provider key'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: oneflow-real-image-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  free-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install model client for local tests
        run: python -m pip install 'huggingface_hub>=1,<2' 'Pillow>=11,<13'
      - name: Dry-run image planner tests (no paid calls)
        run: |
          python -m unittest discover -s tests -p 'test_oneflow_image_generation.py' -v
          python -m unittest discover -s tests -p 'test_oneflow_fal_image.py' -v
          python -m unittest discover -s tests -p 'test_oneflow_ovh_free.py' -v
          python -m unittest discover -s tests -p 'test_oneflow_cloudflare_free_image.py' -v
      - name: Original Snow White prompt preflight (no model call)
        run: |
          python -m oneflow.image_generation \
            --request-file oneflow/requests/snow-white-seven-dwarfs-60s.json \
            --shot S01 --dry-run
      - name: Prove no image was fabricated
        run: test ! -d private-inputs/generated-images

  real-hf-image:
    needs: free-preflight
    if: github.event_name == 'workflow_dispatch' && inputs.approve_paid_image == true && (inputs.image_provider == 'fal' || inputs.image_provider == 'huggingface')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      FAL_KEY: ${{ secrets.FAL_KEY }}
      IMAGE_PROVIDER: ${{ inputs.image_provider }}
      ONE_SENTENCE: ${{ inputs.one_sentence }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check only the explicitly selected provider credential
        shell: bash
        run: |
          set -euo pipefail
          case "$IMAGE_PROVIDER" in
            fal)
              if [ -z "$FAL_KEY" ]; then
                echo "MISSING_FAL_KEY: save fal.ai API key in GitHub Actions secrets as FAL_KEY." >&2
                exit 2
              fi
              ;;
            huggingface)
              if [ -z "$HF_TOKEN" ]; then
                echo "MISSING_HF_TOKEN: supply inference-only GitHub Actions secret HF_TOKEN." >&2
                exit 2
              fi
              ;;
            *) echo "Unsupported provider" >&2; exit 2 ;;
          esac
      - name: Install image inference and PNG validator
        run: python -m pip install 'huggingface_hub>=1,<2' 'fal-client>=0.13,<1' 'Pillow>=11,<13'
      - name: Invoke FLUX exactly once and verify the real PNG
        shell: bash
        run: |
          set -euo pipefail
          case "$IMAGE_PROVIDER" in
            fal) MODULE="oneflow.fal_image" ;;
            huggingface) MODULE="oneflow.image_generation" ;;
            *) echo "Unsupported provider"; exit 2 ;;
          esac
          if [ -z "$ONE_SENTENCE" ]; then
            python -m "$MODULE" \
              --request-file oneflow/requests/snow-white-seven-dwarfs-60s.json \
              --shot S01 --output private-inputs/generated-images \
              --approve-one-image
          else
            python -m "$MODULE" \
              --brief "$ONE_SENTENCE" \
              --shot S01 --output private-inputs/generated-images \
              --approve-one-image
          fi
          test -s private-inputs/generated-images/S01.png
          test -s private-inputs/generated-images/S01.json
      - name: Deliver generated image + review metadata (no automatic publication)
        uses: actions/upload-artifact@v4
        with:
          name: oneflow-real-FLUX-${{ inputs.image_provider }}-S01-${{ github.run_id }}
          path: private-inputs/generated-images/
          if-no-files-found: error
          retention-days: 7

  real-free-ovh-image:
    needs: free-preflight
    if: github.event_name == 'workflow_dispatch' && inputs.image_provider == 'ovh_free' && inputs.approve_free_image == true
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ONE_SENTENCE: ${{ inputs.one_sentence }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PNG verifier
        run: python -m pip install 'Pillow>=11,<13'
      - name: Generate exactly one real image with anonymous Free OVH SDXL
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$ONE_SENTENCE" ]; then
            ONE_SENTENCE='Original black futuristic hypercar at night on a wet racetrack, carbon fiber body, realistic low-angle photo, one car only, no text, no logos, cinematic lighting.'
          fi
          python -m oneflow.ovh_free_image --brief "$ONE_SENTENCE" \
            --shot S01 --output private-inputs/generated-images-ovh \
            --approve-free-test
          test -s private-inputs/generated-images-ovh/S01.png
          test -s private-inputs/generated-images-ovh/S01.json
      - name: Deliver actual OVH image and audit record
        uses: actions/upload-artifact@v4
        with:
          name: oneflow-ovh-FREE-S01-${{ github.run_id }}
          path: private-inputs/generated-images-ovh/
          if-no-files-found: error
          retention-days: 7

  real-free-cloudflare-image:
    needs: free-preflight
    if: github.event_name == 'workflow_dispatch' && inputs.image_provider == 'cloudflare_free' && inputs.approve_free_image == true && inputs.confirm_cloudflare_workers_free == true
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ONE_SENTENCE: ${{ inputs.one_sentence }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Cloudflare-specific secrets before inference
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Missing CLOUDFLARE_ACCOUNT_ID or CLOUDFLARE_API_TOKEN repository secret. No model call made." >&2
            exit 2
          fi
      - name: Install image decoding and verify offline tests
        run: |
          python -m pip install 'Pillow>=11,<13'
          python -m unittest discover -s tests -p 'test_oneflow_cloudflare_free_image.py' -v
      - name: One opt-in FLUX.1 Schnell request, never paid fallback or retry
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$ONE_SENTENCE" ]; then
            ONE_SENTENCE='Original futuristic black carbon-fiber hypercar on a wet racetrack at night, cinematic low angle, realistic rear propulsion system behind the wheels, dramatic photography, single car, no words or watermark.'
          fi
          python -m oneflow.cloudflare_free_image \
            --brief "$ONE_SENTENCE" --shot S01 --steps 4 \
            --output private-inputs/generated-images-cloudflare \
            --approve-free-test --confirm-workers-free
          test -s private-inputs/generated-images-cloudflare/S01.png
          test -s private-inputs/generated-images-cloudflare/S01.json
      - name: Deliver verified PNG and audit metadata for human review
        uses: actions/upload-artifact@v4
        with:
          name: oneflow-cloudflare-FLUX-free-S01-${{ github.run_id }}
          path: private-inputs/generated-images-cloudflare/
          if-no-files-found: error
          retention-days: 7
