name: Cloudflare credentials preflight (no image / no charges)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-credentials-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-without-inference:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Validate repository secret presence and Cloudflare API access safely
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          account = os.environ.get("CF_ACCOUNT_ID", "")
          token = os.environ.get("CF_API_TOKEN", "")

          # Never print any secret or Account ID.
          print("CLOUDFLARE_ACCOUNT_ID:", "PRESENT" if account else "MISSING")
          print("CLOUDFLARE_API_TOKEN:", "PRESENT" if token else "MISSING")
          if not account or not token:
              sys.exit("CHECK_FAILED: add BOTH GitHub Actions repository secrets")
          if re.fullmatch(r"[a-fA-F0-9]{32}", account) is None:
              sys.exit("CHECK_FAILED: Account ID format must be exactly 32 hexadecimal characters")
          print("Account ID format: OK")

          def read_json(url):
              req = Request(url, headers={
                  "Authorization": "Bearer " + token,
                  "Accept": "application/json",
              })
              try:
                  with urlopen(req, timeout=20) as res:
                      raw = res.read(65537)
                  if len(raw) > 65536:
                      raise ValueError("oversized response")
                  return json.loads(raw), None
              except HTTPError as e:
                  return None, e.code
              except (URLError, ValueError, TimeoutError):
                  return None, "NETWORK_OR_JSON_ERROR"

          # Cloudflare supports account-owned and user-owned token verification.
          d, err = read_json(
              "https://api.cloudflare.com/client/v4/accounts/" + account + "/tokens/verify"
          )
          if not (d and d.get("success") and d.get("result", {}).get("status") == "active"):
              d, err = read_json("https://api.cloudflare.com/client/v4/user/tokens/verify")
          if not (d and d.get("success") and d.get("result", {}).get("status") == "active"):
              print("Cloudflare API token active: NOT VERIFIED")
              sys.exit("CHECK_FAILED: Cloudflare token verification failed; verify account and token")
          print("Cloudflare API token active: VERIFIED")

          # Read-only endpoint; NO inference request, NO model usage, NO billing.
          d, err = read_json(
              "https://api.cloudflare.com/client/v4/accounts/" + account + "/ai/models/search"
          )
          if not (d and d.get("success") is True):
              print("Workers AI model-list permission: NOT VERIFIED")
              sys.exit("CHECK_FAILED: Workers AI model-list access failed (no inference requested)")
          print("Workers AI account access: VERIFIED (read-only)")
          print("MODEL_INFERENCE_CALLS: 0")
          print("PREFLIGHT_RESULT: PASS")
          PY
