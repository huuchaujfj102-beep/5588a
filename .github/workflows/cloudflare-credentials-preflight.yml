name: Cloudflare credentials preflight (no image / no charges)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-credentials-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-without-inference:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Validate repository secret presence and Cloudflare API access safely
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          account = os.environ.get("CF_ACCOUNT_ID", "")
          token = os.environ.get("CF_API_TOKEN", "")

          # Never print any secret or Account ID.
          print("CLOUDFLARE_ACCOUNT_ID:", "PRESENT" if account else "MISSING")
          print("CLOUDFLARE_API_TOKEN:", "PRESENT" if token else "MISSING")
          if not account or not token:
              sys.exit("CHECK_FAILED: add BOTH GitHub Actions repository secrets")
          if re.fullmatch(r"[a-fA-F0-9]{32}", account) is None:
              sys.exit("CHECK_FAILED: Account ID format must be exactly 32 hexadecimal characters")
          print("Account ID format: OK")
          print("Token whitespace at edges:", "YES" if token != token.strip() else "NO")
          print("Token contains Bearer prefix:", "YES" if token.lower().startswith("bearer ") else "NO")
          print("Token contains line breaks:", "YES" if "\\n" in token or "\\r" in token else "NO")

          def probe(url):
              req = Request(url, headers={
                  "Authorization": "Bearer " + token,
                  "Accept": "application/json",
              })
              try:
                  with urlopen(req, timeout=20) as response:
                      raw = response.read(65537)
                      status = response.status
                  if len(raw) > 65536:
                      return None, "OVERSIZED_RESPONSE"
                  return json.loads(raw), status
              except HTTPError as exc:
                  try:
                      body = json.loads(exc.read(8192))
                      errors = body.get("errors", []) if isinstance(body, dict) else []
                      codes = [str(e.get("code")) for e in errors if isinstance(e, dict) and isinstance(e.get("code"), int)]
                  except (ValueError, UnicodeDecodeError, OSError):
                      codes = []
                  return None, str(exc.code) + " CF_CODES=" + (",".join(codes) if codes else "NONE")
              except (URLError, ValueError, TimeoutError):
                  return None, "NETWORK_OR_JSON_ERROR"

          # Read-only diagnostics; print only HTTP status categories and booleans,
          # never token, account id, URL, response bodies or error messages.
          account_verify, account_status = probe(
              "https://api.cloudflare.com/client/v4/accounts/" + account + "/tokens/verify"
          )
          user_verify, user_status = probe(
              "https://api.cloudflare.com/client/v4/user/tokens/verify"
          )
          print("Account token verify HTTP:", account_status)
          print("User token verify HTTP:", user_status)

          def active(data):
              if not isinstance(data, dict) or data.get("success") is not True:
                  return False
              result = data.get("result") or {}
              return isinstance(result, dict) and result.get("status") == "active"

          verified = active(account_verify) or active(user_verify)
          print("Token verification endpoint:", "ACTIVE" if verified else "NOT_CONFIRMED")

          # Model search is the definitive read-only permission check here.
          # The token-verify endpoints can be unavailable to narrowly scoped keys.
          models, model_status = probe(
              "https://api.cloudflare.com/client/v4/accounts/" + account + "/ai/models/search"
          )
          print("Workers AI model search HTTP:", model_status)
          accessible = isinstance(models, dict) and models.get("success") is True
          print("Workers AI model-list permission:", "VERIFIED" if accessible else "NOT_VERIFIED")
          print("MODEL_INFERENCE_CALLS: 0")
          if not accessible:
              sys.exit("CHECK_FAILED: Workers AI read-only permission unavailable; verify token scope and account")
          print("PREFLIGHT_RESULT: PASS")
          PY
