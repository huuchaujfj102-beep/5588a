name: Film audit baseline self-test (not production QA)
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline-self-test:
    name: Baseline framework self-test only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Run example audit
        run: python -m film_audit.audit --srt examples/sample.srt --assets examples/assets.csv --output audit-report.json
      - name: Assert example remains review-required
        run: |
          python -c "import json; d=json.load(open('audit-report.json', encoding='utf-8')); assert d['status']=='REVIEW_REQUIRED'; assert len(d['manual_review_required'])==7"
      - name: Write workflow notice
        run: |
          {
            echo "## Baseline self-test only"
            echo "This run validates the framework and example fixtures. It does not establish V5.2 script, image, audio, video, copyright, or final-production approval."
            echo "All seven manual gates remain required."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify production gate fails closed without evidence
        run: |
          if python run_evidence_audit.py evidence-template.json --output v5.2-evidence-report.json; then
            echo "Empty production evidence unexpectedly passed" >&2
            exit 1
          fi
          python -c "import json; d=json.load(open('v5.2-evidence-report.json', encoding='utf-8')); assert d['status']=='FAIL'; assert any(x['code']=='FINAL_FILMS_INCOMPLETE' for x in d['issues'])"
      - name: Upload baseline self-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: film-audit-baseline-self-test-not-production-qa
          path: audit-report.json
