name: Film audit baseline
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Run example audit
        run: python -m film_audit.audit --srt examples/sample.srt --assets examples/assets.csv --output audit-report.json
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: film-audit-report
          path: audit-report.json
