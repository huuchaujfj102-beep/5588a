name: Qianfan One-Sentence I2V -> MP4 -> Audit (opt-in)

on:
  push:
    branches:
      - feature/qianfan-i2v-oneflow-v1-20261102
    paths:
      - .github/workflows/qianfan-i2v-oneflow.yml
      - oneflow/qianfan_i2v.py
      - oneflow/qianfan_media.py
      - tests/test_qianfan_i2v.py
      - tests/test_qianfan_media.py
      - tests/test_musesteamer_air.py
      - tests/test_douyin_publisher.py
      - oneflow/douyin_publisher.py
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/qianfan-i2v-oneflow.yml
      - oneflow/qianfan_i2v.py
      - oneflow/qianfan_media.py
      - tests/test_qianfan_i2v.py
      - tests/test_qianfan_media.py
      - tests/test_musesteamer_air.py
  workflow_dispatch:
    inputs:
      brief:
        description: 'PUBLIC, fictional video brief; visible in GitHub Actions logs'
        type: string
        required: true
        default: 'Same dark silver concept supercar launches and speeds forward on the sunset road. Actual moving wheels, unmistakable acceleration, no dialogue.'
      public_first_frame_url:
        description: 'PUBLIC direct HTTPS JPG/PNG/WebP reference image URL, accessible to Baidu; never enter private content'
        type: string
        required: false
        default: ''
      source_image_run_id:
        description: 'Optional: successful MANUAL OneFlow image generation run ID on main. No public image URL required.'
        type: string
        required: false
        default: ''
      generate_cloudflare_first_frame:
        description: 'One-sentence mode: generate exactly ONE Cloudflare FLUX first frame inside this job'
        type: boolean
        required: true
        default: false
      confirm_cloudflare_workers_free:
        description: 'Cloudflare mode only: confirm Workers Free tier and available free daily quota'
        type: boolean
        required: true
        default: false
      seconds:
        description: 'Native model video duration: Air supports 5s; VQ2 up to 10s; VQ3/VQ4 up to 16s.'
        type: choice
        options: ['5', '10', '15']
        default: '10'
      model:
        description: 'VQ3/VQ4 for native 15s; VQ2 for up to 10s; Air only 5s.'
        type: choice
        options:
          - musesteamer-air-i2v
          - VQ2-Turbo
          - VQ3-Turbo
          - VQ3-Pro
          - VQ4
          - VQ2-Pro
        default: VQ3-Turbo
      confirm_paid:
        description: 'I authorize ONE billable generation of the selected 5/10/15-second model; no posting'
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: qianfan-one-sentence-i2v-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dispatch-gate:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Explicit paid consent and exactly one first-frame input required
        env:
          PAID_OK: ${{ inputs.confirm_paid }}
          URL: ${{ inputs.public_first_frame_url }}
          SOURCE_RUN_ID: ${{ inputs.source_image_run_id }}
          CF: ${{ inputs.generate_cloudflare_first_frame }}
          CF_OK: ${{ inputs.confirm_cloudflare_workers_free }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$PAID_OK" != "true" ]]; then
            echo "::error::One billable video task not authorized, no generation performed."
            exit 2
          fi
          count=0
          [[ -n "$URL" ]] && count=$((count + 1))
          [[ -n "$SOURCE_RUN_ID" ]] && count=$((count + 1))
          [[ "$CF" == "true" ]] && count=$((count + 1))
          if [[ "$count" -ne 1 ]]; then
            echo "::error::Exactly ONE first-frame source is required."
            exit 2
          fi
          if [[ "$CF" == "true" && "$CF_OK" != "true" ]]; then
            echo "::error::Cloudflare Free plan attestation missing."
            exit 2
          fi
          echo "Dispatch gates satisfied; provider availability not yet verified."
  offline-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install real FFmpeg and CJK font for CPU media QC
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Check Python code and FULL CPU video synthesis/test without model requests
        run: |
          set -e
          python -m compileall -q oneflow
          python -m unittest discover -s tests -p 'test_qianfan_media.py' -v
          python -m unittest discover -s tests -p 'test_first_frame_preflight.py' -v
          python -m unittest discover -s tests -p 'test_qianfan_auth_probe.py' -v
          python -m unittest discover -s tests -p 'test_musesteamer_air.py' -v
          python -m unittest discover -s tests -p 'test_qianfan_i2v.py' -v
          python -m unittest discover -s tests -p 'test_douyin_publisher.py' -v
          python -m unittest discover -s tests -p 'test_oneflow_distribution.py' -v
      - name: Create a one-sentence public draft (no paid requests)
        env:
          BRIEF: ${{ inputs.brief || 'Original single supercar accelerates forward through sunset, no morphing.' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m oneflow.qianfan_i2v run --brief "$BRIEF" \
            --first-frame-url "https://example.com/synthetic-reference-only.jpg" \
            --seconds 5 --ratio 16:9 --model musesteamer-air-i2v \
            --out "$RUNNER_TEMP/i2v-offline" --platform douyin
          echo "Offline plan created; no Qianfan API request was sent."

  live-video:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_paid }}
    needs: [offline-validation, dispatch-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exactly one approved frame source before any paid request
        env:
          FRAME: ${{ inputs.public_first_frame_url }}
          SOURCE_RUN_ID: ${{ inputs.source_image_run_id }}
          GENERATE_CF: ${{ inputs.generate_cloudflare_first_frame }}
          CONFIRM_CF_FREE: ${{ inputs.confirm_cloudflare_workers_free }}
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_COUNT=0
          [[ -n "$FRAME" ]] && SOURCE_COUNT=$((SOURCE_COUNT+1))
          [[ -n "$SOURCE_RUN_ID" ]] && SOURCE_COUNT=$((SOURCE_COUNT+1))
          [[ "$GENERATE_CF" == "true" ]] && SOURCE_COUNT=$((SOURCE_COUNT+1))
          if [[ "$SOURCE_COUNT" -ne 1 ]]; then
            echo "Choose EXACTLY one: public image URL, previous image run ID, OR generate Cloudflare first frame." >&2
            exit 2
          fi
          if [[ "$GENERATE_CF" == "true" && "$CONFIRM_CF_FREE" != "true" ]]; then
            echo "Cloudflare Workers Free confirmation required; no paid video request made." >&2
            exit 2
          fi
          if [[ -n "$FRAME" && ! "$FRAME" =~ ^https:// ]]; then
            echo "First frame must be public HTTPS. No billable request made." >&2; exit 2
          fi
          if [[ -n "$SOURCE_RUN_ID" && ! "$SOURCE_RUN_ID" =~ ^[0-9]{8,16}$ ]]; then
            echo "Invalid source image run ID. No billable request made." >&2; exit 2
          fi
      - name: Check image run provenance and a single image artifact
        if: ${{ inputs.source_image_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_image_run_id }}
          SOURCE_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$SOURCE_REPO/actions/runs/$SOURCE_RUN_ID" > "$RUNNER_TEMP/source-run.json"
          jq -e --arg repo "$SOURCE_REPO" '
            .head_repository.full_name == $repo
            and .head_branch == "main"
            and .event == "workflow_dispatch"
            and .conclusion == "success"
            and (.path | startswith(".github/workflows/oneflow-generate-image.yml"))' "$RUNNER_TEMP/source-run.json" >/dev/null
          gh api "repos/$SOURCE_REPO/actions/runs/$SOURCE_RUN_ID/artifacts" > "$RUNNER_TEMP/artifacts.json"
          jq -e '[.artifacts[] | select(.expired == false) | select(.name | test("^oneflow-(real-FLUX|ovh-FREE|cloudflare-FLUX-free)-.*S01-"))] | length == 1' "$RUNNER_TEMP/artifacts.json" >/dev/null
      - name: Download approved generated image (never published to image host)
        if: ${{ inputs.source_image_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.source_image_run_id }}
          github-token: ${{ github.token }}
          pattern: oneflow-*
          merge-multiple: true
          path: ${{ runner.temp }}/reference
      - name: Validate artifact source image locally before any paid model call
        if: ${{ inputs.source_image_run_id != '' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'Pillow>=11,<13'
          python - <<'PY'
          import os
          from pathlib import Path
          from PIL import Image
          root = Path(os.environ["RUNNER_TEMP"]) / "reference"
          images = list(root.rglob("S01.png"))
          if len(images) != 1:
              raise SystemExit("Expected exactly one S01.png; no billable request.")
          image = images[0]
          if not 64 <= image.stat().st_size <= 9_000_000:
              raise SystemExit("Image size outside 64B..9MB; no billable request.")
          with Image.open(image) as im:
              im.verify()
          with Image.open(image) as im:
              if min(im.size) < 300 or im.format != "PNG":
                  raise SystemExit("First frame is invalid/small; no billable request.")
          print("Verified first frame with PNG dimensions >=300px.")
          PY
      - name: Validate PUBLIC reference image real bytes before any paid request
        if: ${{ inputs.public_first_frame_url != '' }}
        shell: bash
        env:
          PUBLIC_IMAGE_URL: ${{ inputs.public_first_frame_url }}
        run: |
          set -euo pipefail
          python -m oneflow.first_frame_preflight --url "$PUBLIC_IMAGE_URL"
      - name: Read-only Qianfan VQ API authentication preflight BEFORE Cloudflare / paid POST
        if: ${{ inputs.model != 'musesteamer-air-i2v' }}
        env:
          QIANFAN_API_KEY: ${{ secrets.QIANFAN_API_KEY }}
          VIDEO_MODEL: ${{ inputs.model }}
        shell: bash
        run: |
          set -euo pipefail
          python -m oneflow.qianfan_auth_probe --model "$VIDEO_MODEL"
          echo "VQ endpoint diagnostic passed. Actual model entitlement/balance not verified by read-only GET."
      - name: Generate one original Cloudflare FLUX first frame (only after explicit Free confirmation)
        if: ${{ inputs.generate_cloudflare_first_frame }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BRIEF: ${{ inputs.brief }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$CLOUDFLARE_ACCOUNT_ID" && -n "$CLOUDFLARE_API_TOKEN" ]] || {
            echo "Cloudflare credentials absent; paid video request will not start." >&2
            exit 2
          }
          python -m pip install 'Pillow>=11,<13'
          python -m oneflow.cloudflare_free_image --brief "$BRIEF" --shot S01 --steps 4 \
            --output "$RUNNER_TEMP/reference" --approve-free-test --confirm-workers-free
          test -s "$RUNNER_TEMP/reference/S01.png"
          python - <<'PY'
          import os
          from pathlib import Path
          from PIL import Image
          path = Path(os.environ["RUNNER_TEMP"]) / "reference" / "S01.png"
          if not 64 <= path.stat().st_size <= 9_000_000:
              raise SystemExit("Cloudflare image outside 64B..9MB; video not billed")
          with Image.open(path) as image:
              image.verify()
          with Image.open(path) as image:
              if min(image.size) < 300 or image.format != "PNG":
                  raise SystemExit("Cloudflare image dimension/format invalid; video not billed")
          print("Verified original Cloudflare first frame, ready for MuseSteamer.")
          PY
      - name: Install and verify FFmpeg, FFprobe and CJK watermark font BEFORE any paid video request
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          python - <<'PY'
          from pathlib import Path
          import shutil
          for binary in ("ffmpeg", "ffprobe"):
              if not shutil.which(binary):
                  raise SystemExit(f"Missing {binary}; stop BEFORE paid Qianfan submission")
          if not any(Path(p).is_file() for p in (
              "/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc",
              "/usr/share/fonts/truetype/noto/NotoSansCJK-Regular.ttc",
          )):
              raise SystemExit("Missing CJK watermark font; stop BEFORE paid Qianfan submission")
          print("Media tools and watermark font preflight passed; paid submission remains explicitly gated.")
          PY
      - name: Submit ONE explicitly approved model task and audit video with watermark
        env:
          QIANFAN_API_KEY: ${{ secrets.QIANFAN_API_KEY }}
          BRIEF: ${{ inputs.brief }}
          FRAME: ${{ inputs.public_first_frame_url }}
          SOURCE_RUN_ID: ${{ inputs.source_image_run_id }}
          GENERATE_CF: ${{ inputs.generate_cloudflare_first_frame }}
          MODEL: ${{ inputs.model }}
          VIDEO_SECONDS: ${{ inputs.seconds }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$QIANFAN_API_KEY" ]]; then echo "QIANFAN_API_KEY absent"; exit 1; fi
          SOUND="synthetic"
          if [[ "$MODEL" == "VQ3-Turbo" || "$MODEL" == "VQ3-Pro" || "$MODEL" == "VQ4" ]]; then SOUND="embedded"; fi
          if [[ "$VIDEO_SECONDS" == "15" && "$MODEL" != "VQ3-Turbo" && "$MODEL" != "VQ3-Pro" && "$MODEL" != "VQ4" ]]; then echo "15 seconds requires VQ3/VQ4; no paid request"; exit 2; fi
          if [[ "$VIDEO_SECONDS" != "5" && "$MODEL" == "musesteamer-air-i2v" ]]; then echo "MuseSteamer Air supports only 5 seconds"; exit 2; fi
          if [[ -n "$SOURCE_RUN_ID" || "$GENERATE_CF" == "true" ]]; then
            FRAME_ARG=(--first-frame-file "$RUNNER_TEMP/reference/S01.png")
          else
            FRAME_ARG=(--first-frame-url "$FRAME")
          fi
          python -m oneflow.qianfan_i2v run \
            --brief "$BRIEF" "${FRAME_ARG[@]}" \
            --seconds "$VIDEO_SECONDS" --ratio 9:16 --resolution 720p \
            --model "$MODEL" --sound "$SOUND" \
            --platform douyin --platform kuaishou --platform xiaohongshu \
            --platform shipinhao --platform youtube \
            --out "$RUNNER_TEMP/i2v-public-test" --confirm-paid
      - name: Build five-platform audited delivery kit (NEVER publish automatically)
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          python -m oneflow.distribution --jobs-root "$RUNNER_TEMP/i2v-public-test"
      - name: Export publicly safe result for human review
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: qianfan-i2v-public-test-output
          path: ${{ runner.temp }}/i2v-public-test/
          retention-days: 1
          if-no-files-found: ignore
