name: MuseSteamer 35s continuous supercar (7 x 5s, paid opt-in)
on:
  workflow_dispatch:
    inputs:
      brief:
        type: string
        required: true
        description: 'PUBLIC original fictional car concept only; no private inputs in this public repo'
        default: 'One dark graphite silver futuristic supercar starts hard, then continually accelerates on the same golden sunset mountain road. Wheels rotate, body remains identical, road parallax, cinematic low-angle tracking, engine roar, no dialogue, never resets.'
      public_first_frame_url:
        type: string
        required: false
        default: ''
        description: 'Optional PUBLIC direct HTTPS first-frame JPG/PNG/WebP URL. Use to SKIP Cloudflare entirely; no private or signed URLs.'
      confirm_cloudflare_workers_free:
        type: boolean
        required: true
        default: false
        description: 'For Cloudflare mode only: confirm available Workers Free quota'
      confirm_seven_paid_muse_tasks:
        type: boolean
        required: true
        default: false
        description: 'I authorize up to SEVEN billable 5s MuseSteamer Air tasks (35s total), each billed separately; NO retries, NO publishing'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/muse-continuous-35s.yml'
      - 'oneflow/muse_35s.py'
      - 'tests/test_muse_35s.py'
      - 'tests/test_muse_35s_real_media.py'
      - 'tests/test_first_frame_preflight.py'
      - 'oneflow/first_frame_preflight.py'
      - 'oneflow/qianfan_media.py'
permissions:
  contents: read
concurrency:
  group: muse-continuous-35s-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg for REAL CPU video processing smoke (no provider calls)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: No-network tests, no account or paid media requests
        run: |
          set -euo pipefail
          python -m compileall -q oneflow
          python -m unittest discover -s tests -p 'test_muse_35s.py' -v
          python -m unittest discover -s tests -p 'test_muse_10s.py' -v
          python -m unittest discover -s tests -p 'test_muse_35s_real_media.py' -v
          python -m unittest discover -s tests -p 'test_first_frame_preflight.py' -v
          python -m unittest discover -s tests -p 'test_qianfan_media.py' -v
  live-seven-part:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_seven_paid_muse_tasks && (inputs.confirm_cloudflare_workers_free || inputs.public_first_frame_url != '') }}
    needs: offline-validation
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      QIANFAN_API_KEY: ${{ secrets.QIANFAN_API_KEY }}
      BRIEF: ${{ inputs.brief }}
      PUBLIC_FIRST_FRAME_URL: ${{ inputs.public_first_frame_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fail closed on absent credentials, media tools or fonts before any model call
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$QIANFAN_API_KEY" ]] || {
            echo "Qianfan API credential missing; no video jobs attempted" >&2
            exit 2
          }
          if [[ -z "$PUBLIC_FIRST_FRAME_URL" ]]; then
            [[ -n "$CLOUDFLARE_ACCOUNT_ID" && -n "$CLOUDFLARE_API_TOKEN" ]] || {
              echo "Cloudflare secrets missing for first-frame creation; no paid video" >&2
              exit 2
            }
          else
            [[ "$PUBLIC_FIRST_FRAME_URL" =~ ^https:// ]] || {
              echo "Only PUBLIC HTTPS image URLs are allowed; no paid video attempted" >&2
              exit 2
            }
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          python -m pip install 'Pillow>=11,<13'
          command -v ffmpeg && command -v ffprobe
          python - <<'PY'
          from pathlib import Path
          choices = (
              "/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc",
              "/usr/share/fonts/truetype/noto/NotoSansCJK-Regular.ttc"
          )
          if not any(Path(x).is_file() for x in choices):
              raise SystemExit("CJK font missing; NO paid request")
          PY
      - name: Verify PUBLIC image responds as a real JPEG/PNG/WebP BEFORE seven paid tasks
        if: ${{ inputs.public_first_frame_url != '' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m oneflow.first_frame_preflight --url "$PUBLIC_FIRST_FRAME_URL"
      - name: Generate one Cloudflare free first frame for all seven continuation clips
        if: ${{ inputs.public_first_frame_url == '' }}
        id: firstframe
        shell: bash
        run: |
          set -euo pipefail
          python -m oneflow.cloudflare_free_image --brief "$BRIEF" \
            --shot S01 --steps 4 --output "$RUNNER_TEMP/reference" \
            --approve-free-test --confirm-workers-free
          test -s "$RUNNER_TEMP/reference/S01.png"
      - name: Seven paid Muse 5s clips, six exact last-frame transitions, 35s portrait MP4 and QC
        id: paidvideo
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$PUBLIC_FIRST_FRAME_URL" ]]; then
            echo "Using user-approved PUBLIC first-frame URL; skipping Cloudflare FLUX entirely."
            python -m oneflow.muse_35s --brief "$BRIEF" \
              --first-frame-url "$PUBLIC_FIRST_FRAME_URL" \
              --out "$RUNNER_TEMP/muse-continuous-35s" --confirm-seven-paid
          else
            python -m oneflow.muse_35s --brief "$BRIEF" \
              --first-frame-file "$RUNNER_TEMP/reference/S01.png" \
              --out "$RUNNER_TEMP/muse-continuous-35s" --confirm-seven-paid
          fi
      - name: Save failure-phase report (no secrets or raw provider errors)
        if: ${{ always() }}
        shell: bash
        env:
          PREFLIGHT_RESULT: ${{ steps.preflight.outcome }}
          FIRST_FRAME_RESULT: ${{ steps.firstframe.outcome }}
          PAID_VIDEO_RESULT: ${{ steps.paidvideo.outcome }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          result = {
              "format": "oneflow-35s-phase-report-v1",
              "preflight": os.getenv("PREFLIGHT_RESULT", "unknown"),
              "cloudflare_frame": os.getenv("FIRST_FRAME_RESULT", "unknown"),
              "cloudflare_was_skipped": bool(os.getenv("PUBLIC_FIRST_FRAME_URL")),
              "seven_segment_workflow": os.getenv("PAID_VIDEO_RESULT", "unknown"),
              "provider_task_submission": "inspect progress.json if present; UNKNOWN otherwise",
              "new_run_advice": "Do not rerun if any paid task was attempted; reconcile tasks and billing."
          }
          dest = Path(os.environ["RUNNER_TEMP"]) / "muse35-phase-report.json"
          dest.write_text(json.dumps(result, indent=2), encoding="utf-8")
          print(json.dumps(result))
          PY
      - name: Export ALL clip ledgers, provider task IDs, partial clips and final QC on failure/success
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: muse-35s-seven-shots-and-task-ledger
          path: |
            ${{ runner.temp }}/muse35-phase-report.json
            ${{ runner.temp }}/muse-continuous-35s/
          retention-days: 1
          if-no-files-found: warn
